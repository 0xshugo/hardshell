schema_version: hardshell.application/v1

application:
  id: aoifuture-postiz
  owner: aoifuture
  environment: production

deployment:
  provider: coolify
  resource_ref: pending-live-readback
  canonical_url: https://social.aoifuture.com

security:
  public_registration: disabled_after_bootstrap
  expected_public_ports:
    - 443
  forbidden:
    privileged: true
    host_network: true
    host_pid: true
    host_ipc: true
    docker_socket_mount: true
    unconfined_seccomp: true
    unconfined_lsm: true
  dangerous_capabilities:
    - SYS_ADMIN
    - SYS_MODULE
    - SYS_PTRACE
    - NET_ADMIN
  secrets:
    storage: managed_secret
    plaintext_allowed: false
    agent_access: denied

operations:
  kill_switch:
    supported: true
    effect: block_new_social_dispatch
  update_policy:
    security_release_sla_hours:
      critical: 24
      high: 72
  verification:
    require_provider_readback: true
    ambiguous_publish_auto_retry: false
