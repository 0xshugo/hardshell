services:
  hardshell-llm:
    image: ollama/ollama:0.40.8
    container_name: hardshell-llm
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1.0
    mem_limit: 3g
    memswap_limit: 3g
    pids_limit: 128
    ports:
      - "127.0.0.1:11436:11434"
    volumes:
      - hardshell-llm-models:/root/.ollama
    tmpfs:
      - /tmp:size=256m
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "2"
      OLLAMA_KEEP_ALIVE: "5m"
    healthcheck:
      test: [CMD, ollama, list]
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  hardshell-llm-models:
    name: hardshell-llm-models
