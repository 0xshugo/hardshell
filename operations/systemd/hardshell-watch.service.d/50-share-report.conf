# Installed by operations/grant-orca-readonly.sh as
#   /etc/systemd/system/hardshell-watch.service.d/50-share-report.conf
#
# Publishes a read-only copy of production output to /var/lib/hardshell-shared
# (root:orca-control, files 0640) so Orca automations running as orca-control can
# see production state without any access to /home/shugo.
#
# "+" runs the helper as root without the unit's User=/sandboxing; the helper
# itself reads the source files with shugo's privileges only. "-" makes helper
# failures non-fatal so sharing can never fail the watch unit.
[Service]
# watch exits 2 when it wrote a report but feeds had gaps: still a usable report.
SuccessExitStatus=2
# Runs only after ExecStart succeeded (exit 0 or 2): copy early-warning + latest reports.
ExecStartPost=-+/usr/local/libexec/hardshell/share-report publish
# Runs after every run, including failures: write version.json with $SERVICE_RESULT/$EXIT_STATUS.
ExecStopPost=-+/usr/local/libexec/hardshell/share-report status
